[package]
name = "hyperlane-midnight"
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
hyperlane-core = { path = "../../hyperlane-core", features = ["async"] }
hyperlane-operation-verifier = { path = "../../applications/hyperlane-operation-verifier" }
hyperlane-warp-route = { path = "../../applications/hyperlane-warp-route" }

async-trait = { workspace = true }
derive-new = { workspace = true }
ethers = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `macros` is required for feature unification: hyperlane-core's
# `rpc_clients::fallback::test` module (unconditionally `pub`) uses
# `#[tokio::test]` but its own tokio dep omits `macros`. When the
# workspace is built, other crates pull `macros` in transitively;
# when running `cargo test -p hyperlane-midnight` standalone the
# graph is too thin and `hyperlane-core` fails to compile without this.
# `io-util` + `process` are needed by the toolkit subprocess wrapper.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }

# Native decode of the Midnight contract ledger state served by the
# indexer (`contractAction.state`). EXACT-pinned with `=` to the devnet's
# ledger 8.x / indexer-standalone 4.0.1 graph (the versions midnight-indexer
# uses). These crates implement the tagged-serialization format the decoder
# depends on, so a caret range could let `cargo update` drift them within a
# minor and silently break decode; bump manually (and re-test decode) when
# intentionally tracking a new ledger release. `onchain-runtime` re-exports
# `state::{ContractState, StateValue}`; `serialize` provides
# `tagged_deserialize`; `storage-core` provides the `DefaultDB` backend (the
# `layout-v2` feature must match the indexer).
midnight-onchain-runtime = "=3.1.0"
midnight-serialize = "=1.1.0"
midnight-storage-core = { version = "=1.2.0", features = ["layout-v2"] }

[dev-dependencies]
tempfile = { workspace = true }
